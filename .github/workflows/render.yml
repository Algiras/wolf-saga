name: Render and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install LaTeX (TinyTeX)
        run: quarto install tinytex

      - name: Install Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu

      - name: Render Book I
        run: |
          cd books
          quarto render --to all
          cp ../llms.txt _book/llms.txt

      - name: Render Book II
        run: |
          cd books/2
          quarto render --to all
          mkdir -p ../_book/2
          cp -r _book/. ../_book/2/

      - name: Render Book III
        run: |
          cd books/3
          quarto render --to all
          mkdir -p ../_book/3
          cp -r _book/. ../_book/3/

      - name: Render Book IV
        run: |
          cd books/4
          quarto render --to all
          mkdir -p ../_book/4
          cp -r _book/. ../_book/4/

      - name: Render Book V
        run: |
          cd books/5
          quarto render --to all
          mkdir -p ../_book/5
          cp -r _book/. ../_book/5/

      - name: Render Book VI
        run: |
          cd books/6
          quarto render --to all
          mkdir -p ../_book/6
          cp -r _book/. ../_book/6/

      - name: Add Wiki (pre-rendered)
        run: |
          mkdir -p books/_book/wiki
          cp -r wiki/. books/_book/wiki/

      - name: Update Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit latest --title "Latest Build" --prerelease --notes "Automatiškai sugeneruotos naujausios knygų versijos (PDF ir EPUB)." || \
          gh release create latest --title "Latest Build" --prerelease --notes "Automatiškai sugeneruotos naujausios knygų versijos (PDF ir EPUB)."
          gh release upload latest books/_book/*.pdf books/_book/*.epub books/[2-6]/_book/*.pdf books/[2-6]/_book/*.epub --clobber

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: books/_book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

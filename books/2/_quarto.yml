    sec-num-depth: 0
    toc: true
    pdf-engine: lualatex
    mainfont: "DejaVu Serif"
    monofont: "DejaVu Sans Mono"
    header-includes: |
      \usepackage{fontspec}
      \renewcommand{\partformat}{}
      \renewcommand{\chapterformat}{}
  epub:
    cover-image: cover.jpg
    title: "Geležinio Vilko Saga II: Auksinis Šešėlis"
    author: "Algimantas Krasauskas"
    description: "Epinis tamsiosios fantastikos pasakojimas apie Vytauto ambiciją, antrąją išdavystę ir Vorsklos mūšį (1387–1399)."

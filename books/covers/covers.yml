# Geležinio Vilko Saga: cover configuration.
# Read by scripts/make_covers.py (compositor). The art_* fields are also machine-readable inputs for the image generator.
# Human-readable version of the prompts: books/covers/art_prompts.md. Re-run: python3 scripts/make_covers.py all

series:
  name: "Geležinio Vilko Saga"
  name_en: "The Iron Wolf Saga"
  # Author is a config value. Decided: Algimantas Krasauskas on all covers (the old Book II teaser said ALGIRDAS; superseded).
  author: &author "Algimantas Krasauskas"
  out_dir: books/covers/out
  fonts:
    display: books/covers/fonts/GrenzeGotisch[wght].ttf   # series name and titles (blackletter; matches Book I)
    display_weight: 700
    secondary: books/covers/fonts/CormorantSC-SemiBold.ttf  # series line, years, author
    secondary_light: books/covers/fonts/CormorantSC-Medium.ttf
    # running text (back-cover blurb of the print wrap cover); the same OFL EB Garamond as the print interior
    body: books/_extensions/saga-print/fonts/EBGaramond-Regular.otf
    body_italic: books/_extensions/saga-print/fonts/EBGaramond-Italic.otf
  title_color: "#EFE6D2"   # bone; identical on all six books (the series system). The per-book accent is colors[2].

books:
  - number: 1
    numeral: "I"
    title_lt: "Vilko Tremtis"
    title_en: "The Wolf's Exile"
    years: "1377–1387"
    author: *author
    series_line: "GELEŽINIO VILKO SAGA · I KNYGA"
    series_line_en: "THE IRON WOLF SAGA · BOOK I"
    # colour key: [darkest background, mid tone, accent]
    colors: ["#0b1824", "#7f9db3", "#ffa63c"]
    focus: [0.5, 0.5]   # subject centre (x, y fractions) used when cropping art to other aspect ratios
    art_file: books/covers/art/book1.jpg
    art_wide_file: books/covers/art/book1_wide.jpg
    art_portrait_aspect: "2:3"
    art_wide_aspect: "16:9"
    art_portrait_min_px: [2048, 3072]
    art_wide_min_px: [3840, 2160]
    # Used only while art_file is missing (textless source; crop = [left, top, right, bottom] in source pixels):
    interim_art: books/1/cover_art.png
    art_prompt: >-
      Painterly dark-realist historical fantasy illustration, oil-on-canvas look with visible brushwork and
      restrained, desaturated natural pigments, cinematic low-key lighting, grounded and gritty rather than glossy,
      high detail, atmospheric depth. Setting: the Grand Duchy of Lithuania and its Baltic borderlands, 14th-15th
      century, period-accurate clothing, weapons and architecture. Recurring series motif: the Iron Wolf, a colossal
      wolf's head and shoulders in strict profile facing right, vast as the sky, translucent and made of storm cloud
      and drifting mist, steel-grey with a frost-blue rim, one single point of light for an eye, its outline
      dissolving at the edges into the atmosphere. It dominates the upper third of the frame and must read at
      thumbnail size. A frozen lake (Galvė) sheeted with cracked ice and low mist. In the lower left, Vytautas, a
      hard-faced man of about 32 with short dark hair and a short beard, rime on his shoulders, in a worn wolf-fur
      mantle over a mail hauberk and a dark cloak, three-quarter turned toward the viewer. In his open palm he holds a
      small pebble of raw, unpolished honey-coloured amber that glows like a live ember and lights his face and the
      falling sparks. His plain single-hand sword rests point-down in the ice. Far behind him, across the ice on an
      island, the half-built outline of an unfinished brick castle: scaffolding, broken stumps of towers, dark half-
      flooded foundations, a few small distant fires. Colour key: #0b1824 (deep ice navy), #7f9db3 (frost slate-blue),
      #ffa63c (amber). Season and light: Winter: dusk after a snowfall, February. Composition: vertical 2:3 portrait.
      Keep the top 14 percent of the frame calm, dark and low-detail (sky), and the bottom 30 percent quiet and low-
      detail (dark ground or water) because a title will be typeset there. Main subject centred in the middle band,
      nothing important within the outer 6 percent of the frame. Absolutely no text, no letters, no watermark anywhere
      in the image.
    art_wide_prompt: >-
      Painterly dark-realist historical fantasy illustration, oil-on-canvas look with visible brushwork and
      restrained, desaturated natural pigments, cinematic low-key lighting, grounded and gritty rather than glossy,
      high detail, atmospheric depth. Setting: the Grand Duchy of Lithuania and its Baltic borderlands, 14th-15th
      century, period-accurate clothing, weapons and architecture. Recurring series motif: the Iron Wolf, a colossal
      wolf's head and shoulders in strict profile facing right, vast as the sky, translucent and made of storm cloud
      and drifting mist, steel-grey with a frost-blue rim, one single point of light for an eye, its outline
      dissolving at the edges into the atmosphere. It dominates the upper third of the frame and must read at
      thumbnail size. A frozen lake (Galvė) sheeted with cracked ice and low mist. In the lower left, Vytautas, a
      hard-faced man of about 32 with short dark hair and a short beard, rime on his shoulders, in a worn wolf-fur
      mantle over a mail hauberk and a dark cloak, three-quarter turned toward the viewer. In his open palm he holds a
      small pebble of raw, unpolished honey-coloured amber that glows like a live ember and lights his face and the
      falling sparks. His plain single-hand sword rests point-down in the ice. Far behind him, across the ice on an
      island, the half-built outline of an unfinished brick castle: scaffolding, broken stumps of towers, dark half-
      flooded foundations, a few small distant fires. Colour key: #0b1824 (deep ice navy), #7f9db3 (frost slate-blue),
      #ffa63c (amber). Season and light: Winter: dusk after a snowfall, February. Composition: horizontal 16:9
      widescreen, the same scene recomposed. Subject and Iron Wolf in the right 60 percent of the frame; the lower-
      left third calm, dark and low-detail because a title will be typeset there. Nothing important within the outer 5
      percent of the frame. Absolutely no text, no letters, no watermark anywhere in the image.
    art_negative: >-
      text, letters, words, numbers, runes, inscriptions, captions, subtitles, watermark, signature, logo, banner
      lettering, readable heraldry or coats of arms, modern objects, power lines, plastic, anachronistic plate armour,
      cartoon, anime, 3D render look, glossy CGI, extra fingers, deformed hands, duplicated figures, cluttered
      composition

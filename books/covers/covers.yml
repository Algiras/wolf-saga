      shoulders and the outline of a crown. On the far horizon, a dust-haze of a vast army and a thin line of Tatar
      horse archers, with a few banner poles and no legible heraldry. Colour key: #2a0a0c (oxblood), #c2411f (dusk
      red), #f2b441 (gold). Season and light: Late summer: August dusk, dry grass. Composition: vertical 2:3 portrait.

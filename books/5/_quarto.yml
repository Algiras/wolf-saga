  pdf:
    documentclass: scrreprt
    number-sections: false
    sec-num-depth: 0
    toc: true
    pdf-engine: lualatex
    mainfont: "DejaVu Serif"
    monofont: "DejaVu Sans Mono"
    header-includes: |
      \usepackage{fontspec}
      \renewcommand{\partformat}{}
      \renewcommand{\chapterformat}{}
  epub:
    cover-image: cover.jpg
    title: "Geležinio Vilko Saga V: Vilko Palikimas"
    author: "Algimantas Krasauskas"
    description: "Epinis tamsiosios fantastikos pasakojimas apie Paskutinės Liepsnos užgesimą, pilietinį karą ir paskutinį vilką (1430–1450)."

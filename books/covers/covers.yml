      flames in an oath: Algirdas, taller, long drooping moustache, fur-lined coat, grim; Kęstutis, broader and
      shorter, his left hand on his sword hilt. Between and behind them, a robed Krivis, an old man in hooded undyed
      linen with a staff, and a small line of kneeling white-clad flame-maidens. Carved oak-post idols at the grove's
      edge. The Iron Wolf of ember and sparks looks down over the grove. Colour key: #1d0c04 (burnt umber black),
      #8a3510 (ember red-brown), #ff8a1f (ember orange). Season and light: Night, 1345 (season not fixed in the

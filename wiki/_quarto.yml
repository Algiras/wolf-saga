project:
  type: website
  output-dir: _site
  resources:
    - graph-explorer.html
  render:
    - "*.qmd"
    - "*/*.qmd"
    - "!_templates/"

lang: en

website:
  title: "Geležinio Vilko Saga · Wiki"
  description: "World bible and encyclopedia for the Iron Wolf Saga."
  search: true
  page-footer:
    center:
      - text: "Image credits"
        href: image-credits.qmd
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: timeline.qmd
        text: Timeline
      - href: graph-explorer.html
        text: Atlas
      - text: Encyclopedia
        menu:
          - characters/index.qmd
          - houses/index.qmd
          - factions/index.qmd
          - places/index.qmd
          - events/index.qmd
          - gods/index.qmd
          - forces/index.qmd
          - magic/index.qmd
          - artifacts/index.qmd
          - creatures/index.qmd
          - books/index.qmd
      - href: codex/index.qmd
        text: Codex
      - href: contributing.qmd
        text: How to add
    right:
      - text: Books
        menu:
          - href: ../index.html
            text: "I · Vilko Tremtis"
          - href: ../2/index.html
            text: "II · Auksinis Šešėlis"
          - href: ../3/index.html
            text: "III · Žaliasis Miškas"
          - href: ../4/index.html
            text: "IV · Nematoma Karūna"
          - href: ../5/index.html
            text: "V · Vilko Palikimas"
          - href: ../6/index.html
            text: "VI · Šventasis Miškas (prequel)"

format:
  html:
    theme:
      light: styles/saga-light.scss
      dark: styles/saga-dark.scss
    include-in-header: styles/head.html
    lightbox: true
    toc: true
    mermaid:
      theme: neutral
